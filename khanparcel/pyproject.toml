[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "khanparcel"
version = "1.0.0"
description = "Khan Parcel — Real-time logistics & delivery platform"
readme = "README.md"
license = { text = "Proprietary" }
requires-python = ">=3.12"
authors = [{ name = "Khan Parcel Engineering" }]

dependencies = [
    # ---------- Django Core ----------
    "Django>=5.1,<6.0",
    "djangorestframework>=3.15,<4.0",
    "drf-spectacular>=0.27,<1.0",
    "django-filter>=24.0",
    "django-cors-headers>=4.4,<5.0",
    "django-environ>=0.11,<1.0",

    # ---------- Auth / JWT ----------
    "djangorestframework-simplejwt>=5.3,<6.0",
    "PyJWT>=2.8,<3.0",
    "pyotp>=2.9,<3.0",
    "qrcode>=7.4,<8.0",

    # ---------- Async / Channels ----------
    "channels[daphne]>=4.1,<5.0",
    "channels-redis>=4.2,<5.0",

    # ---------- Database ----------
    "psycopg[binary]>=3.2,<4.0",

    # ---------- Celery ----------
    "celery[redis]>=5.4,<6.0",
    "django-celery-results>=2.5,<3.0",
    "django-celery-beat>=2.6,<3.0",

    # ---------- Cache / Redis ----------
    "django-redis>=5.4,<6.0",
    "redis>=5.0,<6.0",

    # ---------- GIS ----------
    "shapely>=2.0,<3.0",
    "h3>=3.7,<5.0",

    # ---------- Phone ----------
    "phonenumbers>=8.13",
    "django-phonenumber-field>=8.0,<9.0",

    # ---------- Money ----------
    "django-money>=3.5,<4.0",
    "py-moneyed>=3.0,<4.0",

    # ---------- Storage / Media ----------
    "django-storages[boto3]>=1.14,<2.0",
    "boto3>=1.34",
    "Pillow>=10.4,<11.0",

    # ---------- History / Audit ----------
    "django-simple-history>=3.7,<4.0",
    "django-import-export>=4.1,<5.0",

    # ---------- Security ----------
    "django-axes>=6.5,<7.0",
    "django-ratelimit>=4.1,<5.0",

    # ---------- Routing / Maps ----------
    "polyline>=2.0,<3.0",
    "httpx>=0.27,<1.0",

    # ---------- Notifications ----------
    "firebase-admin>=6.5,<7.0",
    "twilio>=9.0,<10.0",

    # ---------- PDF / Reports ----------
    "weasyprint>=62.0",
    "reportlab>=4.2,<5.0",
    "pandas>=2.2,<3.0",
    "openpyxl>=3.1,<4.0",

    # ---------- Observability ----------
    "sentry-sdk[django,celery]>=2.10",
    "django-prometheus>=2.3,<3.0",
    "prometheus-client>=0.21",
    "structlog>=24.4",

    # ---------- Server ----------
    "gunicorn>=22.0,<23.0",
    "uvicorn[standard]>=0.30",

    # ---------- Utilities ----------
    "python-dateutil>=2.9",
    "orjson>=3.10",
    "uuid7>=0.1",
]

[project.optional-dependencies]
dev = [
    # ---------- Testing ----------
    "pytest>=8.2",
    "pytest-django>=4.8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.5",
    "factory-boy>=3.3",
    "faker>=28.0",
    "freezegun>=1.5",
    "responses>=0.25",
    "respx>=0.21",
    "locust>=2.29",

    # ---------- Quality ----------
    "ruff>=0.5",
    "black>=24.4",
    "mypy>=1.10",
    "django-stubs[compatible-mypy]>=5.0",
    "djangorestframework-stubs>=3.15",
    "pre-commit>=3.7",

    # ---------- Security Audit ----------
    "pip-audit>=2.7",
    "bandit>=1.7",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "config*"]

# ─── Ruff ────────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 120
src = ["apps", "config"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "S",         # bandit (flake8-bandit)
    "B",         # flake8-bugbear
    "A",         # flake8-builtins
    "C4",        # flake8-comprehensions
    "DTZ",       # flake8-datetimez
    "T20",       # flake8-print
    "SIM",       # flake8-simplify
    "RUF",       # ruff-specific
]
ignore = [
    "S101",      # assert in tests is fine
    "S106",      # hardcoded passwords in tests
    "RUF012",    # mutable class attrs in Django models
]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

# ─── Black ───────────────────────────────────────────────────────────────────
[tool.black]
line-length = 120
target-version = ["py312"]

# ─── Mypy ────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings.dev"

# ─── Pytest ──────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "tests.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--tb=short",
    "--reuse-db",
    "-ra",
    "--cov=apps",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-fail-under=85",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks integration tests",
    "e2e: marks end-to-end tests",
]
asyncio_mode = "auto"

# ─── Coverage ────────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["apps"]
omit = ["*/migrations/*", "*/tests/*", "*/test_*", "*/__pycache__/*"]

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "if settings.DEBUG",
    "raise NotImplementedError",
    "pass",
    "\\.\\.\\.",
]
