# =============================================================================
# Khan Parcel — Docker Compose (Development)
# =============================================================================
# Usage: docker compose up -d
#        docker compose logs -f web
# =============================================================================

x-common-env: &common-env
  env_file:
    - .env

x-app-base: &app-base
  build:
    context: .
    dockerfile: Dockerfile
  <<: *common-env
  volumes:
    - .:/app:cached
    - static_data:/app/staticfiles
    - media_data:/app/media
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  # ─── PostgreSQL + PostGIS ──────────────────────────────────────────────────
  postgres:
    image: postgis/postgis:16-3.4
    container_name: kp-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-khanparcel}
      POSTGRES_USER: ${POSTGRES_USER:-khanparcel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-khanparcel_secret}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-khanparcel} -d ${POSTGRES_DB:-khanparcel}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ─── Redis ────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: kp-redis
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ─── MinIO (S3-compatible storage) ────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: kp-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # MinIO bucket initialization
  minio-init:
    image: minio/mc:latest
    container_name: kp-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set kp http://minio:9000 $${AWS_ACCESS_KEY_ID:-minioadmin} $${AWS_SECRET_ACCESS_KEY:-minioadmin};
      mc mb kp/$${AWS_STORAGE_BUCKET_NAME:-khanparcel-media} --ignore-existing;
      mc anonymous set download kp/$${AWS_STORAGE_BUCKET_NAME:-khanparcel-media}/public;
      exit 0;
      "
    <<: *common-env

  # ─── MailHog (dev email) ──────────────────────────────────────────────────
  mailhog:
    image: mailhog/mailhog:latest
    container_name: kp-mailhog
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    restart: unless-stopped

  # ─── Django Web (WSGI — admin, API) ───────────────────────────────────────
  web:
    <<: *app-base
    container_name: kp-web
    command: >
      bash -c "
        python manage.py migrate --noinput &&
        python manage.py collectstatic --noinput 2>/dev/null;
        gunicorn config.wsgi:application
          --bind 0.0.0.0:8000
          --workers 4
          --threads 2
          --timeout 120
          --access-logfile -
          --error-logfile -
          --reload
      "
    ports:
      - "8000:8000"
    restart: unless-stopped

  # ─── Django ASGI (Channels — WebSockets) ──────────────────────────────────
  asgi:
    <<: *app-base
    container_name: kp-asgi
    command: >
      daphne -b 0.0.0.0 -p 8001
        --access-log -
        --proxy-headers
        config.asgi:application
    ports:
      - "8001:8001"
    restart: unless-stopped

  # ─── Celery Worker ────────────────────────────────────────────────────────
  worker:
    <<: *app-base
    container_name: kp-worker
    command: >
      celery -A config.celery worker
        --loglevel=info
        --concurrency=4
        --max-tasks-per-child=1000
        -Q default,dispatch,notifications,payments,reports
        -n worker@%h
    restart: unless-stopped

  # ─── Celery Beat (scheduler) ─────────────────────────────────────────────
  beat:
    <<: *app-base
    container_name: kp-beat
    command: >
      celery -A config.celery beat
        --loglevel=info
        --scheduler django_celery_beat.schedulers:DatabaseScheduler
    restart: unless-stopped

  # ─── Nginx (reverse proxy) ───────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: kp-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - static_data:/app/staticfiles:ro
      - media_data:/app/media:ro
    depends_on:
      - web
      - asgi
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
  static_data:
  media_data:
